version: 1
units: mm
plate:
  width: 120
  depth: 80
  thickness: 4
  edge_margin: 3
mounting:
  size: M3-0.5
  fit: Normal
  post_diameter: 8
  min_wall: 1.5
clearance: 2
devices:
  - name: controller
    step: ../build/demo/inputs/controller.step
    position: [-25, 0]
    rotation_deg: 0
    standoff: 8
    mount_hole_diameter: 3.4
    mounts: [[-14, -10], [14, -10], [-14, 10], [14, 10]]
    keepouts:
      - name: connector
        min: [-8, 15, 0]
        max: [8, 27, 8]
  - name: sensor
    step: ../build/demo/inputs/sensor.step
    position: [27, 0]
    rotation_deg: 90
    standoff: 10
    mount_hole_diameter: 3.4
    mounts: [[-10, -8], [10, -8], [-10, 8], [10, 8]]
